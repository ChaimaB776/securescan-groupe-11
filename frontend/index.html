<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SecureScan - Analyse Projet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SecureScan</h1>
        <p>Analyse de sécurité de projet</p>

        <!-- ANALYSE GIT -->
        <div class="card">
            <h2>Analyser un projet Git</h2>
            <input type="text" id="gitLink" placeholder="https://github.com/user/repository.git">
        </div>

        <!-- UPLOAD ZIP -->
        <div class="card">
            <h2>Ou importer un fichier ZIP</h2>
            <input type="file" id="zipFile" accept=".zip">
        </div>

        <button onclick="analyze()" class="btn-primary">Analyser</button>

        <!-- LOGOUT -->
        <button onclick="logout()" class="btn-danger">Déconnexion</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
