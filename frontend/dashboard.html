<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultats - SecureScan groupe 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="card large">
    <h1>📊 Résultats d'analyse</h1>

    <div class="score-container">
        <div class="score-bar">
            <div id="scoreProgress"></div>
        </div>
        <p>Score global : <span id="score">--</span>/100</p>
    </div>

    <select id="filter" onchange="filterResults()">
        <option value="all">Toutes les vulnérabilités</option>
        <option value="High">🔴 High</option>
        <option value="Medium">🟠 Medium</option>
        <option value="Low">🟢 Low</option>
    </select>

    <div id="results"></div>

    <button onclick="goBack()">Nouvelle analyse</button>
</div>

<script src="script.js"></script>
</body>
</html>
