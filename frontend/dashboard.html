<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SecureScan - Résultats Analyse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .score-display {
            font-size: 48px;
            font-weight: bold;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
            color: white;
        }
        
        .score-excellent { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .score-good { background: linear-gradient(135deg, #f39c12, #f1c40f); }
        .score-fair { background: linear-gradient(135deg, #e67e22, #e74c3c); }
        .score-poor { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        
        .statistics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        
        .stat-critical { background-color: #c0392b; }
        .stat-high { background-color: #e67e22; }
        .stat-medium { background-color: #f39c12; }
        .stat-low { background-color: #27ae60; }
        
        .vulnerabilities-list {
            margin-top: 30px;
        }
        
        .vulnerability-item {
            border-left: 5px solid;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .vuln-critical { border-left-color: #c0392b; }
        .vuln-high { border-left-color: #e67e22; }
        .vuln-medium { border-left-color: #f39c12; }
        .vuln-low { border-left-color: #27ae60; }
        
        .vulnerability-item strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .vuln-details {
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .vuln-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
            margin-bottom: 8px;
            color: white;
        }
        
        .vuln-badge-critical { background-color: #c0392b; }
        .vuln-badge-high { background-color: #e67e22; }
        .vuln-badge-medium { background-color: #f39c12; }
        .vuln-badge-low { background-color: #27ae60; }
        
        .project-info {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .project-info p {
            margin: 8px 0;
            font-size: 14px;
        }
        
        .no-vulnerabilities {
            padding: 20px;
            text-align: center;
            background-color: #d5f4e6;
            color: #27ae60;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card large">
            <h1>📊 Résultats de l'analyse sécurité</h1>

            <!-- Infos du projet -->
            <div id="summary"></div>

            <!-- Loading spinner -->
            <div id="loading" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p><strong>Analyse en cours...</strong></p>
                <p style="font-size: 12px; color: #666;">Les scanners de sécurité s'exécutent (Semgrep, ESLint, npm audit, TruffleHog, Bandit, Composer Audit)</p>
            </div>

            <!-- Score global -->
            <div id="score"></div>

            <!-- Résultats détaillés -->
            <div id="results"></div>

            <div class="actions">
                <button onclick="deleteProject()">
                    🗑 Supprimer le projet
                </button>

                <button class="secondary" onclick="window.location.href='index.html'">
                    🔙 Retour
                </button>

                <button class="secondary" onclick="logout()">
                    🚪 Se déconnecter
                </button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
